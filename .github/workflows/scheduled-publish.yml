name: Scheduled Page Publish

on:
  workflow_dispatch:
    inputs:
      page_path:
        description: 'Page path to publish (e.g. en/home/news/my-page)'
        required: true
        type: string
      publish_date:
        description: 'Publish date (YYYY-MM-DD)'
        required: true
        type: string
      publish_time:
        description: 'Publish time in UTC (HH:MM)'
        required: true
        type: string

jobs:
  scheduled-publish:
    runs-on: ubuntu-latest
    env:
      # AEM_BEARER_TOKEN (personal login token, short-lived) is for testing and wins when set.
      # Otherwise AEM_API_TOKEN (site admin API key) is used.
      AEM_BEARER_TOKEN: ${{ secrets.AEM_BEARER_TOKEN }}
      AEM_API_TOKEN: ${{ secrets.AEM_API_TOKEN }}
    steps:
      - name: Calculate wait time
        id: wait
        run: |
          PUBLISH_DATETIME="${{ github.event.inputs.publish_date }} ${{ github.event.inputs.publish_time }}:00"
          PUBLISH_EPOCH=$(date -d "$PUBLISH_DATETIME UTC" +%s)
          NOW_EPOCH=$(date +%s)
          WAIT_SECONDS=$((PUBLISH_EPOCH - NOW_EPOCH))
          if [ $WAIT_SECONDS -le 0 ]; then
            echo "Scheduled time is in the past! Publishing immediately..."
            WAIT_SECONDS=0
          fi
          echo "wait_seconds=$WAIT_SECONDS" >> $GITHUB_OUTPUT
          echo "Will wait $WAIT_SECONDS seconds before publishing."

      - name: Wait until scheduled time
        run: |
          echo "Waiting ${{ steps.wait.outputs.wait_seconds }} seconds..."
          sleep ${{ steps.wait.outputs.wait_seconds }}

      - name: Preview Page
        run: |
          if [ -n "$AEM_BEARER_TOKEN" ]; then
            echo "Using AEM_BEARER_TOKEN"
            AUTH="Bearer $AEM_BEARER_TOKEN"
          else
            echo "Using AEM_API_TOKEN"
            AUTH="token $AEM_API_TOKEN"
          fi
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: $AUTH" \
            "https://admin.hlx.page/preview/aman-kumar24-dev/usta-foundation-site/main/${{ github.event.inputs.page_path }}")
          echo "Preview response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Preview failed with status $RESPONSE"
            exit 1
          fi

      - name: Publish Page to Live
        run: |
          if [ -n "$AEM_BEARER_TOKEN" ]; then
            AUTH="Bearer $AEM_BEARER_TOKEN"
          else
            AUTH="token $AEM_API_TOKEN"
          fi
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: $AUTH" \
            "https://admin.hlx.page/live/aman-kumar24-dev/usta-foundation-site/main/${{ github.event.inputs.page_path }}")
          echo "Publish response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Publish failed with status $RESPONSE"
            exit 1
          fi
          echo "✅ Page successfully published!"
          echo "Live URL: https://main--usta-foundation-site--aman-kumar24-dev.aem.live/${{ github.event.inputs.page_path }}"
